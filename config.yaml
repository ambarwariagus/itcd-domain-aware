# ITCD Domain-Aware Configuration File
# Author: Agus Ambarwari

# Input settings
input:
  image_path: "data/input/your_image.tif"  # Path to input GeoTIFF

# Tiling settings
tiling:
  tile_size: [1024, 1024]  # Tile dimensions [width, height]
  overlap: 256              # Overlap pixels between tiles
  output_dir: "output/tiles"

# Model settings
model:
  config_path: "models/250525_R50_RESTOR_fold_0/config.yaml"
  weights_path: "models/250525_R50_RESTOR_fold_0/model_best_AP50.pth"
  score_threshold: 0.5      # Detection confidence threshold
  nms_threshold: 0.3        # NMS threshold during inference

# Post-processing settings
postprocessing:
  # Directory for intermediate GeoJSON files
  output_geojson_dir: "output/geojson"
  
  # NMS algorithm selection: "spatial_nms" or "dc_gnms"
  nms_algorithm: "spatial_nms"
  
  # Spatial NMS settings (Ball et al.)
  spatial_nms:
    iou_threshold: 0.5
    confidence_threshold: 0.5
    area_threshold: 2.0      # Minimum area (m²) to keep
    edge_shift: 1.0          # Edge margin (meters)
  
  # DC-GNMS settings
  dc_gnms:
    box_filter_shift: 1.0    # Center/edge zone margin (meters)
    overlap_threshold: 0.5   # IoA/IoMin threshold for NMS
    cross_zone_threshold: 0.15  # Cross-zone overlap tolerance
    simplify_tolerance: 0.05 # Geometry simplification (meters)

# Output settings
output:
  final_output_dir: "output/final"
  output_filename: "tree_crowns.gpkg"  # Final GeoPackage filename
  keep_intermediate: true   # Keep intermediate files (tiles, predictions, geojson)

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  save_log: true
  log_file: "output/pipeline.log"
