name: itcd-domain-aware
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.10
  - pip
  - numpy
  - pandas
  - geopandas
  - rasterio
  - shapely
  - scikit-image
  - pyyaml
  - pip:
    - segment-geospatial
    - opencv-python
    - pycocotools
    - torch
    - torchvision
    - detectron2 -f https://dl.fbaipublicfiles.com/detectron2/wheels/cu118/torch2.0/index.html
