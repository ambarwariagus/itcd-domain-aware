[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itcd"
version = "0.1.0"
description = "Inference and Geospatial Post-Processing Pipeline for Individual Tree Crown Delineation"
authors = [
    { name = "Agus Ambarwari", email = "ambarwariagus@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "opencv-python-headless",
    "rasterio",
    "geopandas",
    "shapely>=2.0.0",
    "scikit-image",
    "pycocotools",
    "segment-geospatial",
    "tqdm"
]
keywords = ["remote-sensing", "tree-crown-detection", "detectron2", "spatial-nms", "geospatial", "itcd"]

[project.urls]
Homepage = "https://github.com/ambarwariagus/itcd-domain-aware"
Repository = "https://github.com/ambarwariagus/itcd-domain-aware"

[tool.setuptools.packages.find]
include = ["itcd*"]
